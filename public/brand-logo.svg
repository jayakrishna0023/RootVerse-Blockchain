<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KOLLI HILLS Produce logo">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bgGradient)"/>
  
  <!-- Mountain Icon with Glow -->
  <g transform="translate(256, 180)" filter="url(#glow)">
    <path d="M 0 -60 L -55 30 L -20 58 L -35 72 C -48 52 -90 -10 -90 -10 L -150 80 H 150 L 0 -60 Z" 
          fill="#FFFFFF" opacity="0.95"/>
  </g>
  
  <!-- Text: KOLLI HILLS -->
  <text x="256" y="340" font-family="'Arial Black', 'Arial', sans-serif" 
        font-size="64" font-weight="900" fill="#1F2937" text-anchor="middle" letter-spacing="2">
    KOLLI HILLS
  </text>
  
  <!-- Subtext: Produce -->
  <text x="256" y="380" font-family="'Arial', sans-serif" 
        font-size="28" font-weight="600" fill="#10B981" text-anchor="middle" letter-spacing="8">
    PRODUCE
  </text>
  
