    <path d="M -6.267 -3.455 a 3.066 3.066 0 0 0 1.745 -0.723 a 3.066 3.066 0 0 1 3.976 0 a 3.066 3.066 0 0 0 1.745 0.723 a 3.066 3.066 0 0 1 2.812 2.812 c 0.051 0.643 0.304 1.254 0.723 1.745 a 3.066 3.066 0 0 1 0 3.976 a 3.066 3.066 0 0 0 -0.723 1.745 a 3.066 3.066 0 0 1 -2.812 2.812 a 3.066 3.066 0 0 0 -1.745 0.723 a 3.066 3.066 0 0 1 -3.976 0 a 3.066 3.066 0 0 0 -1.745 -0.723 a 3.066 3.066 0 0 1 -2.812 -2.812 a 3.066 3.066 0 0 0 -0.723 -1.745 a 3.066 3.066 0 0 1 0 -3.976 a 3.066 3.066 0 0 0 0.723 -1.745 a 3.066 3.066 0 0 1 2.812 -2.812 z m 7.44 5.252 a 1 1 0 0 0 -1.414 -1.414 L -3 3.586 L -7.293 -0.707 a 1 1 0 0 0 -1.414 1.414 l 2 2 a 1 1 0 0 0 1.414 0 l 4 -4 z" 
          fill="#FFFFFF" opacity="0.95"/>
    <text x="0" y="58" font-family="'Arial', sans-serif" 
